<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <style>{{.CSS}}</style>
</head>
<body>
  <div class="layout">
    <header>
      <p class="wordmark">γραφή</p>
      <h1>{{.Title}}</h1>
    </header>
    <article class="post-body">
      {{.HTML}}
    </article>
    <aside class="margin-column">
      {{range .Comments}}
      <details class="postit" data-comment-id="{{.ID}}" open>
        <summary class="postit-id">{{.ID}}</summary>
        <div class="postit-body">{{.Body}}</div>
      </details>
      {{end}}
    </aside>
  </div>
  <script>{{.JS}}</script>
</body>
</html>
