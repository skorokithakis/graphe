<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <style>{{.CSS}}</style>
</head>
<body>
  <div class="layout">
    <header>
      <p class="wordmark">γραφή</p>
      <h1>{{.Title}}</h1>
    </header>
    <article class="post-body">
      {{.HTML}}
    </article>
    <aside class="margin-column">
      {{range .Comments}}
      <details class="postit{{if .Orphaned}} orphaned{{end}}" data-comment-id="{{.ID}}" open>
        <summary class="postit-id">
          {{if .Orphaned}}<span class="orphan-badge">orphaned</span>{{end}}
          <span class="postit-id-text">{{.ID}}</span>
          <span class="postit-controls">
            <button class="postit-nav postit-nav-up" title="Previous comment" aria-label="Previous comment">▲</button>
            <button class="postit-nav postit-nav-down" title="Next comment" aria-label="Next comment">▼</button>
            <button class="postit-close" title="Delete comment" aria-label="Delete comment">✕</button>
          </span>
        </summary>
        <div class="postit-body">{{.Body}}</div>
      </details>
      {{end}}
    </aside>
  </div>
  <script>{{.JS}}</script>
</body>
</html>
