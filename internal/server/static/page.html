<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <!-- Runs before the stylesheet to avoid a flash of unstyled content when the
       user has chosen a theme. Reads localStorage and sets data-theme on <html>
       immediately. Also stores the logical mode in data-theme-mode so the main
       script can sync the button glyph without re-reading localStorage.
       The try/catch is justified here: a throw before the stylesheet would block
       the entire page render. -->
  <script>(function(){try{var t=localStorage.getItem("graphe-theme");var m=(t==="light"||t==="dark")?t:"auto";document.documentElement.setAttribute("data-theme-mode",m);if(m==="light"||m==="dark"){document.documentElement.setAttribute("data-theme",m);}else{if(window.matchMedia("(prefers-color-scheme: dark)").matches){document.documentElement.setAttribute("data-theme","dark");}}}catch(e){}}());</script>
  <style>{{.CSS}}</style>
</head>
<body>
  <div class="layout">
    <header>
      <p class="wordmark">γραφή</p>
      <h1>{{.Title}}</h1>
    </header>
    <article class="post-body">
      {{.HTML}}
    </article>
    <aside class="margin-column">
      {{range .Comments}}
      <details class="postit{{if .Orphaned}} orphaned{{end}}" data-comment-id="{{.ID}}" open>
        <summary class="postit-id">
          {{if .Orphaned}}<span class="orphan-badge">orphaned</span>{{end}}
          <span class="postit-id-text">{{.ID}}</span>
          <span class="postit-controls">
            <button class="postit-nav postit-nav-up" title="Previous comment" aria-label="Previous comment">▲</button>
            <button class="postit-nav postit-nav-down" title="Next comment" aria-label="Next comment">▼</button>
            <button class="postit-close" title="Delete comment" aria-label="Delete comment">✕</button>
          </span>
        </summary>
        <div class="postit-body">{{.Body}}</div>
      </details>
      {{end}}
    </aside>
  </div>
  <button class="theme-toggle" aria-label="Theme: auto">◐</button>
  <script>{{.JS}}</script>
</body>
</html>
